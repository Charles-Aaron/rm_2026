/**:
  ros__parameters:
    common:
      frontend: zlio
      descriptor_type: scan_context
      frame_topic: frontend/frame
      prediction_topic: frontend/odometry
      session_topic: frontend/session
      odom_frame: imu_odom
      sensor_frame: imu_link
      map_frame: map
      input_cloud_in_local_frame: true
      # common.body 由 mapping.launch.py 从 frames.yaml 转换，统一机械外参来源。
      scan_context:
        enabled: true
        # 底盘原点贴地：雷达高 0.20 m，IMU 比雷达低 0.04412 m。
        # 描述子输入为 IMU 系点云，使用 IMU 离地高度，可由 sensor_height 覆盖。
        lidar_height: 0.15588
    prior_map:
      enabled: false
    uwb:
      enabled: false
    # 把首个有效观测的底盘位姿锚为单位位姿，map 原点与启动底盘完整重合。
    # 提示经过 common.body 转为 IMU 位姿；不影响去畸变点云的 IMU 局部坐标。
    startup_hint:
      enabled: true
      force_until_matched: false
      x: 0.0
      y: 0.0
      z: 0.0
      yaw_deg: 0.0
    loop:
      enabled: true
    graph:
      # 建图回环需要保留历史位姿变量。
      fixed_lag_seconds: 0.0
    trajectory:
      # 这两项可由 launch 覆盖；默认手动调用保存服务。
      save_directory: /home/nuc/x_sentry_ws/maps/biai_prior_chassis
      save_on_shutdown: false
      save_global_pcd: true
      map_voxel_resolution: 0.15
      keyframe:
        distance: -1.0
        angle_deg: -1.0
        min_interval: 0.0
        max_interval: 0.5
    reset:
      service: /zlio/reset_internal
    services:
      save_map: ~/save_map
      relocalize: ~/relocalize
      reset: ~/reset
    visualization:
      enabled: true
      publish_prior_map: false
      publish_runtime_map: true
      publish_map_axes: false
      publish_paths: true
      publish_debug_registration: false
      map_publish_period: 2.0
    output:
      legacy:
        # 建图后端发布 map -> chassis_link，前端不直接发布 TF。
        enabled: true
        publish_pose: false
        publish_twist: false
        publish_path: false
        publish_tf: true
        publish_untrusted: false
        danger_topic: mapping_backend/danger
      world_cloud:
        enabled: false
