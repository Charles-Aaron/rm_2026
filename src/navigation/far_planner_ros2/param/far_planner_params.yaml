# FAR Planner ROS 2 参数配置文件
# 文件路径: param/far_planner_params.yaml

far_planner:
  ros__parameters:
    # 规划器基本参数
    use_sim_time: false
    
    # 规划参数
    max_planning_time: 1.0           # 最大规划时间(秒)
    max_search_time: 0.1             # 最大搜索时间(秒)
    plan_resolution: 0.1              # 规划分辨率(米)
    plan_distance: 10.0              # 规划距离(米)
    
    # 机器人参数
    robot_radius: 0.2                # 机器人安全半径(米)
    max_vel_x: 2.8                   # 最大线速度(m/s)
    max_vel_theta: 3.0               # 最大角速度(rad/s)
    max_acc_x: 5.0                   # 最大线加速度(m/s²)
    max_acc_theta: 5.0               # 最大角加速度(rad/s²)
    
    # 障碍物处理参数
    obstacle_threshold: 0.5           # 障碍物判定阈值
    visibility_range: 10.0             # 可视化范围(米)
    min_obstacle_height: 0.0          # 最小障碍物高度(米)
    max_obstacle_height: 2.0           # 最大障碍物高度(米)
    
    # 地图参数
    map_resolution: 0.05              # 地图分辨率(米)
    map_width: 200                    # 地图宽度(像素)
    map_height: 200                   # 地图高度(像素)
    
    # 规划模式
    planning_mode: 1                  # 0: 保守模式(仅自由空间), 1: 可尝试模式(允许未知空间)
    allow_unknown: true               # 允许穿越未知区域
    
    # 路径平滑参数
    enable_smoothing: true            # 启用路径平滑
    smoothing_iterations: 10           # 平滑迭代次数
    smoothing_weight: 0.3              # 平滑权重
    
    # 调试参数
    publish_visualization: true        # 发布可视化数据
    debug_output: false               # 调试输出
    
    # 话题配置
    pointcloud_topic: "/terrain_map"  # 点云输入话题
    robot_pose_topic: "/odom"         # 机器人位姿话题
    output_path_topic: "/plan"        # 规划路径输出话题
    
    # 命名空间
    frame_id: "map"                   # 坐标系ID
