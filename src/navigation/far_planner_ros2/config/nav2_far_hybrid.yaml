# RoboMaster 哨兵导航系统 - Nav2 + FAR Planner 集成配置
# 配置文件路径: config/nav2_far_hybrid.yaml

# 机器人命名空间
robot_namespace: "red_standard_robot1"

# 规划器服务器配置
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 10.0
    planner_plugins: ["GridBased", "FARBased"]
    
    # Nav2 SmacPlannerHybrid (主规划器)
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      enabled: true
      tolerance: 0.5
      allow_unknown: true
      downsample_costmap: false
      downsampling_factor: 1
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 3.5
      cost_travel_multiplier: 2.0
      motion_model_for_search: "DUBIN"
      angle_quantization_bins: 64
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      minimum_turning_radius: 0.05
      retrospective_penalty: 0.025
      reverse_penalty: 1.0
      change_penalty: 0.0
      non_straight_penalty: 1.20
      cost_penalty: 2.0
      rotation_penalty: 5.0
      lookup_table_size: 20.0
      cache_obstacle_heuristic: True
      allow_reverse_expansion: False
      smooth_path: True
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true

    # FAR Planner (快速响应规划器)
    FARBased:
      plugin: "far_planner_ros2::FARPlannerGlobalPlanner"
      enabled: true
      tolerance: 0.5
      max_planning_time: 0.5
      robot_radius: 0.2
      visibility_range: 10.0
      obstacle_threshold: 0.5
      allow_unknown: true
      use_pointcloud: true
      pointcloud_topic: "/red_standard_robot1/terrain_map"

# 切换策略配置
switch_strategy:
  mode: "priority"
  primary_planner: "GridBased"
  fallback_to_primary: true
  trigger_conditions:
    dynamic_obstacle_detected: true
    planning_time_exceeded: 0.5
    path_collision: true

# 代价地图配置 (保持与原系统一致)
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: "odom"
      robot_base_frame: "base_link"
      static_map: false
      rolling_window: true
      width: 5.0
      height: 5.0
      resolution: 0.05

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: "map"
      robot_base_frame: "base_link"
      static_map: true
      rolling_window: false
      width: 20.0
      height: 20.0
      resolution: 0.05

# 控制器配置
controller_server:
  ros__parameters:
    follow_pure_pursuit:
      plugin: "pb_omni_pid_pursuit_controller/PbOmniPIDPursuit"
      max_linear_accel: 2.5
      max_linear_vel: 2.8
      lookahead_dist: 2.2
      rotate_to_goal_angular_vel: 1.5
      translate_tolerance: 0.05
      rotate_tolerance: 0.05
      controller_frequency: 15.0

# 话题重映射
topic_remappings:
  # 输入话题
  pointcloud_input: "/red_standard_robot1/terrain_map"
  odometry_input: "/red_standard_robot1/odom"
  goal_pose_input: "/red_standard_robot1/goal_pose"
  
  # 输出话题
  plan_output: "/red_standard_robot1/plan"
  plan_far_output: "/red_standard_robot1/plan_far"
  cmd_vel_output: "/red_standard_robot1/cmd_vel"
