# Ego Planner 参数配置
ego_planner:
  ros__parameters:
    use_sim_time: false
    
    # 地图参数
    grid_map:
      resolution: 0.1
      x_size: 60.0
      y_size: 60.0
      inflation_radius: 0.5
    
    # 机器人参数
    max_vel: 1.0
    max_acc: 1.0
    max_jerk: 1.0
    
    # B样条参数
    bspline_order: 3
    control_points_interval: 0.4
    
    # 优化参数
    optimization_time: 0.5
    smooth_weight: 0.2
    collision_weight: 10.0
    
    # 话题配置
    pointcloud_topic: "/terrain_map"
    robot_pose_topic: "/odom"
    output_path_topic: "/plan"
    global_path_topic: "/global_path"
    
    # 坐标系
    frame_id: "map"
